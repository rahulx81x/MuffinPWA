[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect URIs are public (visible in the browser during OAuth); omit from secret scan.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_REDIRECT_URI"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false