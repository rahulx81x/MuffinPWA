[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect URIs are public (visible in the browser during OAuth); omit from secret scan.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_REDIRECT_URI"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false